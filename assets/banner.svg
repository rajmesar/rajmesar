<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0710"/>
      <stop offset="55%" stop-color="#4a0e1f"/>
      <stop offset="100%" stop-color="#800020"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2c4ce"/>
      <stop offset="50%" stop-color="#e9c46a"/>
      <stop offset="100%" stop-color="#f2c4ce"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9184a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9184a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f2c4ce" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .name { font-size: 54px; font-weight: 800; letter-spacing: 1px; animation: rise 1.2s ease-out .2s both; }
      .role { font-size: 22px; fill: #f2c4ce; letter-spacing: 3px; animation: rise 1.2s ease-out .8s both; }
      .tag  { font-size: 15px; fill: #f2c4ce; opacity: .85; animation: fade 1s ease-out 1.6s both; }
      .orb  { animation: float 7s ease-in-out infinite; }
      .orb2 { animation: float 9s ease-in-out infinite reverse; }
      .bar  { transform-origin: bottom; transform-box: fill-box; animation: grow 2.4s ease-in-out infinite alternate; }
      .line { stroke-dasharray: 900; animation: draw 3s ease-out 1s both; }
      .dot  { animation: pulse 2s ease-in-out infinite; }
      @keyframes rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fade  { from { opacity: 0; } to { opacity: .85; } }
      @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(20px,-14px); } }
      @keyframes grow  { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
      @keyframes draw  { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle class="orb"  cx="1020" cy="70"  r="170" fill="url(#glow)"/>
  <circle class="orb2" cx="140"  cy="290" r="140" fill="url(#glow)"/>

  <!-- animated data chart (right) -->
  <g transform="translate(860,95)" opacity="0.9">
    <rect class="bar" x="0"   y="80"  width="26" height="80"  rx="4" fill="#a4243b" style="animation-delay:0s"/>
    <rect class="bar" x="40"  y="40"  width="26" height="120" rx="4" fill="#c9184a" style="animation-delay:.3s"/>
    <rect class="bar" x="80"  y="95"  width="26" height="65"  rx="4" fill="#a4243b" style="animation-delay:.6s"/>
    <rect class="bar" x="120" y="20"  width="26" height="140" rx="4" fill="#e9c46a" style="animation-delay:.9s"/>
    <rect class="bar" x="160" y="60"  width="26" height="100" rx="4" fill="#c9184a" style="animation-delay:1.2s"/>
    <rect class="bar" x="200" y="5"   width="26" height="155" rx="4" fill="#f2c4ce" style="animation-delay:1.5s"/>
    <polyline class="line" points="13,70 53,30 93,85 133,10 173,50 213,-5" fill="none" stroke="#e9c46a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-10" y1="162" x2="240" y2="162" stroke="#f2c4ce" stroke-opacity=".35"/>
  </g>

  <!-- text -->
  <g class="t">
    <text class="role" x="70" y="100">◆ SENIOR DATA ENGINEER · 10+ YEARS</text>
    <text class="name" x="70" y="170" fill="url(#gold)">Balachandra Raju</text>
    <text class="tag" x="70" y="215">Azure Databricks · Snowflake · PySpark · ADF · Kafka · AWS · Terraform</text>
    <text class="tag" x="70" y="245">Cloud data platforms for Financial Services, Healthcare &amp; Life Sciences</text>
  </g>
  <circle class="dot" cx="76"  cy="282" r="4" fill="#e9c46a"/>
  <circle class="dot" cx="92"  cy="282" r="4" fill="#e9c46a" style="animation-delay:.4s"/>
  <circle class="dot" cx="108" cy="282" r="4" fill="#e9c46a" style="animation-delay:.8s"/>
</svg>
